[colors]
background = #343061
foreground = #e5dfe6
primary    = #c27193
accent = #EB5B00

[bar/main]
monitor = ${env:MONITOR:eDP-1}
width = 100%
height = 30
offset-y = 0
override-redirect = false
transparent = true
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = JetBrainsMono Nerd Font:size=11;2
modules-left = workspaces active_window
modules-center = date
modules-right = filesystem cpu memory wifi volume battery powermenu
border-size = 0
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
separator = " / "

[module/workspaces]
type = internal/i3
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false
enable-click = true
enable-scroll = true
reverse-scroll = false

format = <label-state>

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}

label-unfocused = %name%
label-visible = %name%
label-urgent = %name%
label-urgent-background = ${colors.accent}
label-urgent-foreground = ${colors.background}

label-focused-padding = 1
label-unfocused-padding = 1
label-visible-padding = 1
label-urgent-padding = 1

[module/active_window]
type = internal/xwindow
label = %title%
ellipsis = true
label-maxlen = 40
wrapping-scroll = false
format-padding = 0
label-padding = 0

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
label = %used% (%percentage_used%%)
label-foreground = ${colors.accent}

label-mounted = %used% of %total%
label-unmounted = %mountpoint%: not mounted

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = %percentage:2%% 

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = %percentage_used%% 

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi-status.sh
interval = 5
click-left = ~/.config/polybar/scripts/wifi-popup.sh
label = %output%


[module/volume]
type = internal/pulseaudio
use-ui-max = true

format-volume = <label-volume> <ramp-volume>
format-muted = <label-muted> <ramp-volume>

label-volume = %percentage%%
label-muted = muted

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

format-muted-foreground = #888

# click-left = ~/.config/polybar/scripts/volume-control.sh
# click-right = pavucontrol
click-right = ~/.config/rofi/applets/bin/volume.sh



# [module/battery]
